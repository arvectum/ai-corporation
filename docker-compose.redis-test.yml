name: arvectum-redis-test
services:
  redis:
    image: redis:7.4.9-alpine
    container_name: arvectum-redis-test
    command: ["redis-server"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15
