name: arvectum-redis
services:
  redis:
    image: redis:7.4.9-alpine
    container_name: arvectum-redis
    command: ["redis-server", "--requirepass", "${ARVECTUM_REDIS_PASSWORD:?ARVECTUM_REDIS_PASSWORD must be set}"]
    environment:
      REDISCLI_AUTH: "${ARVECTUM_REDIS_PASSWORD:?ARVECTUM_REDIS_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - arvectum-redis-net
    volumes:
      - arvectum_redis_data:/data

networks:
  arvectum-redis-net:
    driver: bridge

volumes:
  arvectum_redis_data:
