limitations:
- Метрики относятся только к детерминированному synthetic contract replay и не являются оценкой качества на реальных закупках.
- OCR-срез содержит воспроизводимый OCR-подобный шум в исходном тексте, но downstream matcher получает структурированные значения; качество OCR-извлечения не измеряется.
- Train, dev и test не имеют общих item hash, source record или производителей test-среза, однако используют одно семейство генератора; generator bias раскрыт явно.
- Независимая человеческая приёмка разметки не проведена, поэтому перевод в shadow runtime заблокирован.
